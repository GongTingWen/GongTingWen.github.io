<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>讀「爸」一方：看圖猜成語，向偉大的爸爸們致敬</title>
	<link rel="stylesheet" type="text/css" href="styles.css" />
	<script src="https://code.jquery.com/jquery-1.11.1.min.js"></script>
</head>
<body>
	<div id="page1" class="container">
		<div id="cover_img"></div>
		<div id="start_btn"></div>
	</div>
	<div id="page2" class="container">
		<div id="question_ctn">
			<div id="question_img"></div>
			<div id="submit_btn"></div>
		</div>
		<div id="input_ctn">
			<div id="confirm_btn">💾暫存</div>
		</div>
		<div id="input_frame">
			<input id="input_frame1" maxlength="1"/>
			<input id="input_frame2" maxlength="1"/>
			<input id="input_frame3" maxlength="1"/>
			<input id="input_frame4" maxlength="1"/>
		</div>
		<div id="right_img"></div>
	</div>
	<div id="page3" class="container">
		<div id="answer_ctn">
			<div id="idiom_text"></div>
			<div id="explanation_text"></div>
			<div id="origin_text"></div>
			<div id="example_text"></div>
			<div id="next_btn"></div>
			<div id="end_text">闖關完成，恭喜成功<br>讀「爸」一方！</div>
		</div>
	</div>
	<audio id="right_sound" src="right.mp3"></audio>
	<audio id="wrong_sound" src="wrong.mp3"></audio>
	<script src="script.js"></script>
</body>
</html>
